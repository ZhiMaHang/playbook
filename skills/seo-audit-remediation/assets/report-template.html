<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO 诊断报告</title>
<!--
  用法：把数据写成 JSON 文件，运行 node scripts/build_report.mjs 数据.json 输出.html，生成内容已写好的静态页面（不开脚本也能看）。
  直接在浏览器打开本模板时，会用下面 id="report-data" 里的示例数据现画。
  某一节没有数据，就给空数组或删掉那个键，页面会自动不显示那一节。
  页面顺序按诊断报告五部分：摘要 → 范围与方法 → 问题清单 → 路线图 → 附录（内部检查评分）。
  字段说明：
    site / scope / date / ua：抬头；sources：数据来源列表
    baseline：关键基线 [{label, value, source}]，后台的展示、点击、收录，带日期和来源
    conclusions：结论三句 ["卡在哪一环", "为什么", "最该先做什么"]；只有一句时也可以用 summary
    bottleneck：卡点（六环中的哪一环，一句话）
    keyNumbers：关键数字 [{label, value, source}]，3–5 个
    nextSteps：下一步 ["谁、什么时候做完、哪天复查"]
    method：范围与方法 ["抽样、工具、抓取身份、评分表版本、缺的数据、依据标注"]
    rootCauses：根因 [{title, detail}]，不超过 3 条
    findings：问题卡 [{id, priority, title, evidence, scope, basis, stage, recommendation, reason, owner, acceptance, impact}]
      priority 取 "P0" | "P1" | "P2" | "P3" | "待定"；title 写现象；stage 写六环中的哪一环；reason 写级别理由
    plan：路线图 [{priority, title, owner, where, how, acceptance, due}]
    passed：["已达标项（事实）"]
    decisions：待拍板 [{title, options, recommendation, reason}]
    retest：复测指标 [{metric, now, target, how, date}]
    scores：内部检查评分 [{label, value, max, note, primary}]（放附录，检查口径，不代表效果）
    stages：整改前后对照 [{label, value}]，例如 现网 / 预览实测 / 预计全部完成
    dimensions：{columns:[引擎名...], rows:[{name, max, values:[...], reason}]}
    pageTypes：[{type, urls, sampled, score, issues}]
    rubricVersion：评分表版本，如 "v2"
-->
<script type="application/json" id="report-data">
{
  "site": "example.com",
  "scope": "产品分类页 + 型号页（示例数据，演示用虚构值）",
  "date": "YYYY-MM-DD",
  "ua": "桌面浏览器 / 真人手机 / Googlebot 智能手机 / 百度蜘蛛",
  "sources": ["直接请求线上页面", "Search Console 网页报告（YYYY-MM-DD）", "抓取工具全量抓取"],
  "baseline": [
    {"label": "近 28 天展示", "value": "12,400", "source": "GSC，YYYY-MM-DD"},
    {"label": "已编入索引 / 站点地图网址", "value": "1,020 / 1,860", "source": "GSC 网页报告，YYYY-MM-DD"}
  ],
  "conclusions": [
    "卡在收录：新型号页近一半未编入索引。",
    "原因是新模板正式页带着预览时的 noindex，参数表又靠被 robots 禁止的接口加载。",
    "先去掉 noindex、放开接口或改成服务器输出，再谈标题和正文。"
  ],
  "bottleneck": "收录",
  "keyNumbers": [
    {"label": "带 noindex 的正式型号页", "value": "420 页", "source": "抓取工具，YYYY-MM-DD"}
  ],
  "nextSteps": ["开发本周内去掉 noindex，上线当天按十项核对；两周后看网页报告。"],
  "method": ["每类模板抽 5 页，重点页全查；未检查：文章模板。", "评分表 v2；标题、描述长度为经验值。"],
  "rootCauses": [
    {"title": "示例根因", "detail": "现象 → 证据 → 原因，一条证据链写完整。"}
  ],
  "findings": [
    {"id": "PROD-01", "priority": "P0", "title": "新型号页模板的正式页带 noindex", "evidence": "源代码 meta robots，YYYY-MM-DD，Googlebot UA", "scope": "全部新型号页，420 页", "basis": "Google robots meta 规范", "stage": "收录", "recommendation": "正式页去掉 noindex，测试页保留", "reason": "核心模板整体退出索引；改一处即可", "owner": "开发", "acceptance": "上线当天源代码和响应头无 noindex；1–2 周后网页报告里这些页回到已编入"},
    {"id": "PROD-07", "priority": "P3", "title": "部分型号页标题超过 60 个字符", "evidence": "抓取工具导出，YYYY-MM-DD", "scope": "38 页", "basis": "经验值", "stage": "点击", "recommendation": "先看结果页是否被改写，再决定改不改", "reason": "经验值类，证据不足", "owner": "运营", "acceptance": "下次核对结果页"}
  ],
  "plan": [
    {"priority": "P0", "title": "去掉正式页 noindex", "owner": "开发", "where": "型号页模板", "how": "按问题卡 PROD-01", "acceptance": "上线核对十项", "due": "本周"}
  ],
  "passed": ["示例：http 和 www 均一步 301 到 https 规范主机。"],
  "decisions": [
    {"title": "示例待拍板", "options": "A / B", "recommendation": "A", "reason": "理由"}
  ],
  "retest": [
    {"metric": "带 noindex 的正式页", "now": "420", "target": "0", "how": "抓取工具全量抓取", "date": "复查日期"}
  ],
  "rubricVersion": "v2",
  "scores": [
    {"label": "谷歌", "value": 58, "max": 100, "note": "主引擎", "primary": true},
    {"label": "百度", "value": 39, "max": 100, "note": "对照"}
  ],
  "stages": [
    {"label": "现网", "value": 53},
    {"label": "预览实测", "value": 72}
  ],
  "dimensions": {
    "columns": ["谷歌", "百度"],
    "rows": [
      {"name": "收录与抓取", "max": 25, "values": [12, 6], "reason": "示例：扣分原因写实测值。"}
    ]
  },
  "pageTypes": [
    {"type": "型号页", "urls": 1860, "sampled": 20, "score": 61, "issues": "示例：参数表不在原始 HTML 里。"}
  ]
}
</script>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e2de;
  --accent: #2f5bd3; --p0: #c0392b; --p1: #b9770e; --p2: #5f6b7a; --p3: #4f7a6a; --tbd: #7a5fa0; --ok: #1e8449;
  --p0-bg: #fbeaea; --p1-bg: #fdf3e2; --p2-bg: #eef0f3; --p3-bg: #e9f2ee; --tbd-bg: #f1ecf7; --ok-bg: #e8f5ec;
  --radius: 10px; --gutter: 16px;
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151515; --surface: #1f1f1e; --text: #ecebe7; --muted: #a3a29d; --line: #34332f;
    --accent: #7c9cff; --p0: #ff7b6e; --p1: #f0b44c; --p2: #a8b3c2; --p3: #8fcfb5; --tbd: #c3a8eb; --ok: #5fd08a;
    --p0-bg: #3a1f1c; --p1-bg: #37291a; --p2-bg: #262a30; --p3-bg: #1d2f28; --tbd-bg: #2c2438; --ok-bg: #1b3325;
  }
}
:root[data-theme="dark"] {
  --bg: #151515; --surface: #1f1f1e; --text: #ecebe7; --muted: #a3a29d; --line: #34332f;
  --accent: #7c9cff; --p0: #ff7b6e; --p1: #f0b44c; --p2: #a8b3c2; --p3: #8fcfb5; --tbd: #c3a8eb; --ok: #5fd08a;
  --p0-bg: #3a1f1c; --p1-bg: #37291a; --p2-bg: #262a30; --p3-bg: #1d2f28; --tbd-bg: #2c2438; --ok-bg: #1b3325;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6; font-size: 15px; }
main { max-width: 1080px; margin: 0 auto; padding: 32px var(--gutter) 64px; }
header h1 { font-size: 26px; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 13px; }
.summary { font-size: 17px; margin: 18px 0 8px; }
ol.conclusions { font-size: 16px; margin: 16px 0 8px; padding-left: 22px; }
section { margin-top: 36px; }
section > h2 { font-size: 18px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
section h3.sub { font-size: 15px; margin: 18px 0 8px; }
.note { color: var(--muted); font-size: 13px; margin: 8px 0 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card .label { color: var(--muted); font-size: 13px; }
.card .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.card .value small { font-size: 15px; color: var(--muted); font-weight: 400; }
.card .src { color: var(--muted); font-size: 12px; margin-top: 4px; }
.card.primary { border-color: var(--accent); }
.bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.stages { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.stage b { font-variant-numeric: tabular-nums; }
.arrow { color: var(--muted); }
.list { display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
.item h3 { font-size: 15px; margin: 0 0 4px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.item h3 .id { color: var(--muted); font-weight: 600; font-size: 13px; }
.item p { margin: 4px 0 0; }
.item .k { color: var(--muted); font-size: 13px; margin-right: 6px; }
.chip { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.chip.P0 { color: var(--p0); background: var(--p0-bg); }
.chip.P1 { color: var(--p1); background: var(--p1-bg); }
.chip.P2 { color: var(--p2); background: var(--p2-bg); }
.chip.P3 { color: var(--p3); background: var(--p3-bg); }
.chip.TBD { color: var(--tbd); background: var(--tbd-bg); }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
ul.plain { margin: 0; padding-left: 20px; }
ul.ok li::marker { color: var(--ok); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs button { font: inherit; font-size: 13px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
.tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main id="app"><!--STATIC--></main>
<script>
/*RENDER-START*/
function renderReport(d) {
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function has(a) { return a && a.length; }
  function sec(title, inner) { return '<section><h2>' + esc(title) + '</h2>' + inner + '</section>'; }
  function table(head, rows) {
    return '<div class="table-wrap"><table><thead><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function td(v, num) { return '<td' + (num ? ' class="num"' : '') + '>' + esc(v) + '</td>'; }
  function kv(label, v) { return v ? '<p><span class="k">' + esc(label) + '</span>' + esc(v) + '</p>' : ''; }
  function cls(p) { return /^P[0-3]$/.test(p) ? p : 'TBD'; }
  function ul(list, extra) { return '<ul class="plain' + (extra ? ' ' + extra : '') + '">' + list.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; }
  function numCards(list) {
    return '<div class="cards">' + list.map(function (n) {
      return '<div class="card"><div class="label">' + esc(n.label) + '</div><div class="value">' + esc(n.value) + '</div>' +
        (n.source ? '<div class="src">' + esc(n.source) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  var LEVELS = [
    ['P0 阻断', '核心页面整体打不开、抓不到、收不进、读不到；安全问题、人工处置；对外说法有法律风险；上线阻塞项', '当天响应，立即排期；修好前暂停其他上线'],
    ['P1 严重', '一类重要页面的收录、排名或转化明显受损，有数据证据；对外说法违反本站口径', '本迭代内（1–2 周）'],
    ['P2 一般', '局部或单页问题，影响有限', '本月或本季度，可攒一批修'],
    ['P3 观察', '经验值类、证据不足或收益很小', '记录在案，顺手改或等数据'],
    ['待定', '依赖还没定下的本站口径或负责人决定', '单列，定下来再定级']
  ];
  var ORDER = ['P0', 'P1', 'P2', 'P3', '待定'];
  function rank(p) { var i = ORDER.indexOf(p); return i < 0 ? ORDER.length : i; }
  function prioritized(list, render) {
    var sorted = list.slice().sort(function (a, b) { return rank(a.priority) - rank(b.priority); });
    var ps = ORDER.filter(function (p) { return sorted.some(function (x) { return x.priority === p; }); });
    var tabs = '<div class="tabs" role="group" hidden>' + ['全部'].concat(ps).map(function (p, i) {
      return '<button type="button" data-p="' + esc(p) + '" aria-pressed="' + (i === 0) + '">' + esc(p) + '</button>';
    }).join('') + '</div>';
    return tabs + '<div class="list">' + sorted.map(function (x) { return '<div class="item" data-p="' + esc(x.priority) + '">' + render(x) + '</div>'; }).join('') + '</div>';
  }
  var h = '';

  // 1. 摘要
  h += '<header><h1>' + esc(d.site) + ' · SEO 诊断</h1><div class="meta">' + esc(d.scope) + ' · ' + esc(d.date) +
    (d.ua ? ' · 抓取身份：' + esc(d.ua) : '') + '</div>' +
    (has(d.sources) ? '<div class="meta">数据：' + d.sources.map(esc).join('；') + '</div>' : '') + '</header>';
  if (has(d.baseline)) h += numCards(d.baseline);
  if (has(d.conclusions)) h += '<ol class="conclusions">' + d.conclusions.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
  else if (d.summary) h += '<p class="summary">' + esc(d.summary) + '</p>';
  if (d.bottleneck) h += '<p><span class="chip P1">卡点</span> ' + esc(d.bottleneck) + '</p>';
  if (has(d.keyNumbers)) h += sec('关键数字', numCards(d.keyNumbers));
  if (has(d.findings)) {
    var top = d.findings.filter(function (f) { return f.priority === 'P0' || f.priority === 'P1'; })
      .sort(function (a, b) { return rank(a.priority) - rank(b.priority); }).slice(0, 5);
    if (top.length) h += sec('P0 / P1（编号对应问题清单）', '<ul class="plain">' + top.map(function (f) {
      return '<li><span class="chip ' + cls(f.priority) + '">' + esc(f.priority) + '</span> ' + (f.id ? esc(f.id) + ' ' : '') + esc(f.title) + '</li>';
    }).join('') + '</ul>');
  }
  if (has(d.decisions)) h += sec('要拍板的事', '<div class="list">' + d.decisions.map(function (x, i) {
    return '<div class="item"><h3>' + (i + 1) + '. ' + esc(x.title) + '</h3>' + kv('选项', x.options) + kv('建议', x.recommendation) + kv('理由', x.reason) + '</div>';
  }).join('') + '</div>');
  if (has(d.nextSteps)) h += sec('下一步', ul(d.nextSteps));

  // 2. 范围与方法
  if (has(d.method)) h += sec('范围与方法', ul(d.method));

  // 3. 问题清单
  if (has(d.rootCauses)) h += sec('根因', '<div class="list">' + d.rootCauses.map(function (r, i) {
    return '<div class="item"><h3>' + (i + 1) + '. ' + esc(r.title) + '</h3><p>' + esc(r.detail) + '</p></div>';
  }).join('') + '</div>');
  var legend = '<h3 class="sub">级别判定标准</h3>' + table(['级别', '判定标准', '时限（经验值）'], LEVELS.map(function (l) {
    return [td(l[0]), td(l[1]), td(l[2])];
  })) + '<p class="note">先后 ≈ 影响 × 范围 ÷ 难度；安全问题、人工处置、法律风险、上线阻塞项直接 P0；经验值类问题先记 P3；不照搬工具的严重度；级别后面写理由。</p>';
  if (has(d.findings)) h += sec('问题清单', legend + '<h3 class="sub">问题卡</h3>' + prioritized(d.findings, function (f) {
    return '<h3><span class="chip ' + cls(f.priority) + '">' + esc(f.priority) + '</span>' + (f.id ? '<span class="id">' + esc(f.id) + '</span>' : '') + esc(f.title) + '</h3>' +
      kv('证据', f.evidence) + kv('范围', f.scope) + kv('依据', f.basis) + kv('环节', f.stage) + kv('影响', f.impact) +
      kv('建议', f.recommendation) + kv('级别理由', f.reason) + kv('负责人', f.owner) + kv('验收', f.acceptance);
  }));

  // 4. 路线图
  if (has(d.plan)) h += sec('路线图', prioritized(d.plan, function (p) {
    return '<h3><span class="chip ' + cls(p.priority) + '">' + esc(p.priority) + '</span>' + esc(p.title) + '</h3>' +
      (p.owner ? '<p><span class="k">负责</span>' + esc(p.owner) + (p.where ? ' · ' + esc(p.where) : '') + (p.due ? ' · ' + esc(p.due) : '') + '</p>' : '') +
      kv('做法', p.how) + kv('验收', p.acceptance);
  }));
  if (has(d.passed)) h += sec('已达标（未扣分）', ul(d.passed, 'ok'));
  if (has(d.retest)) h += sec('复测指标', table(['指标', '现在', '目标', '怎么看', '复查日期'], d.retest.map(function (r) {
    return [td(r.metric), td(r.now, 1), td(r.target, 1), td(r.how), td(r.date, 1)];
  })));

  // 5. 附录：内部检查评分
  var app = '';
  if (has(d.scores)) {
    app += '<div class="cards">' + d.scores.map(function (s) {
      var pct = Math.max(0, Math.min(100, s.value / (s.max || 100) * 100));
      return '<div class="card' + (s.primary ? ' primary' : '') + '"><div class="label">' + esc(s.label) + (s.note ? ' · ' + esc(s.note) : '') +
        '</div><div class="value">' + esc(s.value) + '<small> / ' + esc(s.max || 100) + '</small></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    }).join('') + '</div>';
  }
  if (has(d.stages)) {
    app += '<div class="stages">' + d.stages.map(function (s, i) {
      return (i ? '<span class="arrow">→</span>' : '') + '<span class="stage">' + esc(s.label) + ' <b>' + esc(s.value) + '</b></span>';
    }).join('') + '</div>';
  }
  if (d.dimensions && has(d.dimensions.rows)) {
    var cols = d.dimensions.columns || [];
    app += '<h3 class="sub">分项打分</h3>' + table(['维度', '满分'].concat(cols).concat(['扣分原因']), d.dimensions.rows.map(function (r) {
      return [td(r.name), td(r.max, 1)].concat((r.values || []).map(function (v) { return td(v, 1); })).concat([td(r.reason)]);
    }));
  }
  if (has(d.pageTypes)) app += '<h3 class="sub">各类页面得分</h3>' + table(['页面类型', '网址数', '抽样', '得分', '主要扣分'], d.pageTypes.map(function (p) {
    return [td(p.type), td(p.urls, 1), td(p.sampled, 1), td(p.score, 1), td(p.issues)];
  }));
  if (app) h += sec('附录 · 内部检查评分' + (d.rubricVersion ? '（评分表 ' + d.rubricVersion + '）' : ''),
    '<p class="note">检查口径，不代表效果：分数按自定评分表打，不是搜索引擎的分数；换了评分表版本的分数不能直接比。效果看后台数据。</p>' + app);
  h += '<footer>评分为自定标准下的页面与站点检查结果，不是搜索引擎的官方分数；页面分高不等于能排上。</footer>';
  return h;
}
/*RENDER-END*/
(function () {
  var app = document.getElementById('app');
  // 用 build_report.mjs 生成的文件内容已写在页面里；只有直接打开模板时才在浏览器里现画
  if (!app.firstElementChild) app.innerHTML = renderReport(JSON.parse(document.getElementById('report-data').textContent));
  Array.prototype.forEach.call(app.querySelectorAll('.tabs'), function (t) { t.hidden = false; });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('.tabs button'); if (!b) return;
    var group = b.parentNode, list = group.nextElementSibling, p = b.getAttribute('data-p');
    Array.prototype.forEach.call(group.children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    Array.prototype.forEach.call(list.children, function (x) { x.style.display = (p === '全部' || x.getAttribute('data-p') === p) ? '' : 'none'; });
  });
})();
</script>
